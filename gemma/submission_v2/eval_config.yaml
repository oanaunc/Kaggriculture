# v2 per-task budgets. Identical to the harness defaults that romanrozen's 0.12 run
# used (no eval_config.yaml), except max_time_minutes 60 -> 8: a tail guard only.
# Container setup is not counted in this budget; hitting it grades the working tree.
evaluation:
  timeout_seconds: 300
  max_time_minutes: 8
  max_tool_calls: 100
  max_turns: 500
